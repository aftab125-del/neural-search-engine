[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralsearch"
version = "0.1.0"
description = "High-performance local-first private hybrid neural search engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "CSE (AI & DS) Engineering" }
]
dependencies = [
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
neural = [
    "onnxruntime>=1.17.0",
    "tokenizers>=0.19.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
